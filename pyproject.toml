[project]
name = "btengine"
version = "0.1.0"
description = "Event-driven backtesting engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy", "yfinance", "matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
